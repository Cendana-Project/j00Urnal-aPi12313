# Railway deployment configuration
version: 2

services:
  api:
    build: .
    ports:
      - "8081:8081"
    environment:
      - ENV=production
      - LOG_LEVEL=info
      - GRACEFUL_SHUTDOWN_TIMOUT=30s
      - SERVER_PORT=8081
      - SERVER_BASE_URL=${RAILWAY_PUBLIC_DOMAIN}
      - DATABASE_DSN=${DATABASE_URL}
      - REDIS_CACHE_DSN=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
