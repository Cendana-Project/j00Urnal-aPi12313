services:
  - type: web
    name: journal-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /_internal/healthz
    # Render will automatically set PORT environment variable
    # The app will use PORT if SERVER_PORT is not set
    
    # Auto-deploy settings
    autoDeploy: true
    
    # Build configuration
    dockerCommand: null  # Will use ENTRYPOINT from Dockerfile
    
    # Environment variables
    # Note: Sensitive values should be set in Render dashboard, not here
    envVars:
      # Application Configuration
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: GRACEFUL_SHUTDOWN_TIMEOUT
        value: 30s
      
      # Database Configuration (set in Render dashboard)
      # - DATABASE_DSN: Pooled connection (use Supabase pooler URL port 6543 with pgbouncer=true)
      #   Example: postgresql://postgres.xxx:[PASSWORD]@aws-0-region.pooler.supabase.com:6543/postgres?pgbouncer=true
      # - DATABASE_DIRECT_DSN: Direct connection for migrations (port 5432, no pgbouncer)
      #   Example: postgresql://postgres.xxx:[PASSWORD]@aws-0-region.pooler.supabase.com:5432/postgres
      
      # Database connection pool settings (optional - using defaults)
      - key: DATABASE_MAX_IDLE_CONNS
        value: 5
      - key: DATABASE_MAX_OPEN_CONNS
        value: 15
      - key: DATABASE_MAX_CONN_LIFETIME
        value: 30m
      
      # Redis Configuration (set in Render dashboard if using cache)
      # - REDIS_CACHE_DSN: Redis connection URL (e.g., redis://default:password@endpoint.upstash.io:6379)
      #   Get from Upstash Dashboard → Redis Details → Endpoint
      # - REDIS_IS_CACHE_DISABLE: Set to "false" to enable cache, "true" to disable
      
      # JWT Token Configuration (MUST be set in Render dashboard)
      # Generate secure secrets with: openssl rand -base64 32
      # - TOKEN_PASSWORD_SALT: (minimum 32 characters)
      # - TOKEN_ACCESS_TOKEN_SECRET: (minimum 32 characters)
      # - TOKEN_REFRESH_TOKEN_SECRET: (minimum 32 characters)
      
      # Token durations (optional - using defaults)
      - key: TOKEN_ACCESS_TOKEN_DURATION
        value: 1h
      - key: TOKEN_REFRESH_TOKEN_DURATION
        value: 720h
      
      # SMTP Email Configuration (optional - set if using email features)
      # - SMTP_HOST: SMTP server hostname
      # - SMTP_PORT: SMTP port (587 for TLS, 465 for SSL)
      # - SMTP_USERNAME: SMTP username
      # - SMTP_PASSWORD: SMTP password
      # - SMTP_FROM_EMAIL: From email address

